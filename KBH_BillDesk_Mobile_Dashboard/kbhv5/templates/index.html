<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>KBH BillDesk</title><style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--primary:#2563eb;--border:#e5e9f0;--green:#16834a;--red:#c62828;--amber:#a15c00}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.top{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:10}.toprow{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:20px}.sub{font-size:12px;color:#b8c2d1;margin-top:2px}.wrap{max-width:1100px;margin:auto;padding:14px}.controls,.card,.modalbox{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 4px 16px #1720330b}.controls{padding:12px;display:grid;gap:10px;margin-bottom:12px}.row{display:flex;gap:10px}.row>*{min-width:0;flex:1}select,input{width:100%;border:1px solid #d7dce5;border-radius:12px;padding:13px;background:white;color:var(--text)}button{border:0;border-radius:12px;padding:12px 15px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:white}.ghost{background:#eef3ff;color:#1d4ed8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{padding:13px;background:white;border:1px solid var(--border);border-radius:14px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.list{display:grid;gap:10px}.student{padding:15px}.studenttop{display:flex;justify-content:space-between;gap:10px}.roll{font-weight:800}.status{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px;white-space:nowrap}.paid{background:#dcfce7;color:var(--green)}.notpaid{background:#fff3cd;color:var(--amber)}.error{background:#fee2e2;color:var(--red)}.unknown{background:#eef2f7;color:#526071}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.meta div{background:#f7f9fc;border-radius:10px;padding:8px}.meta small{display:block;color:var(--muted);font-size:10px}.meta strong{font-size:13px}.empty{text-align:center;padding:30px;color:var(--muted)}.modal{display:none;position:fixed;inset:0;background:#0b1220aa;z-index:30;padding:12px;align-items:end}.modal.open{display:flex}.modalbox{width:100%;max-width:650px;margin:auto;padding:16px;max-height:92vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;gap:10px;margin-top:14px}.actions>*{flex:1}.toast{position:fixed;left:14px;right:14px;bottom:14px;padding:14px;border-radius:12px;background:#111827;color:white;display:none;z-index:50;text-align:center}.loading{opacity:.6;pointer-events:none}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.stats .stat:last-child{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column}.meta{grid-template-columns:1fr 1fr}.top{padding-top:max(14px,env(safe-area-inset-top))}}@media(min-width:701px){.modal{align-items:center}.controls{grid-template-columns:1fr 1fr}.controls .row{grid-column:1/-1}.student{display:grid;grid-template-columns:1.3fr 2fr auto;align-items:center;gap:18px}.meta{margin:0}.student button{width:100px}}
</style></head><body><header class="top"><div class="toprow"><div><div class="brand">KBH BillDesk</div><div class="sub">Mobile Payment Management Dashboard</div></div><button class="ghost" onclick="loadStudents()">↻ Refresh</button></div></header><main class="wrap"><section class="controls"><div class="row"><select id="month" onchange="loadStudents()"><option>Loading months…</option></select><button class="primary" onclick="loadStudents()">Load Students</button></div><div class="row"><input id="search" placeholder="Search Roll No / Admission No" oninput="render()"><select id="filter" onchange="render()"><option value="ALL">All Status</option><option>PAID</option><option>NOT PAID</option><option>ERROR</option></select></div><div class="row"><button id="autoBtn" class="primary" onclick="updateNonPaid()">⚡ Update NOT PAID Students</button><div><div id="autoStatus" class="card" style="padding:12px;display:flex;align-items:center;color:#687386">Checks only students currently marked NOT PAID and updates Google Sheet automatically.</div><pre id="autoLog" class="card" style="margin:8px 0 0;padding:10px;max-height:220px;overflow:auto;white-space:pre-wrap;font-size:12px;display:none"></pre></div></div></section><section class="stats"><div class="stat"><b id="total">0</b><span>Total Students</span></div><div class="stat"><b id="paid">0</b><span>PAID Students</span></div><div class="stat"><b id="notpaid">0</b><span>NOT PAID Students</span></div><div class="stat"><b id="errors">0</b><span>ERROR Students</span></div><div class="stat"><b id="paidAmount">₹0</b><span>Paid Amount</span></div><div class="stat"><b id="pendingAmount">₹0</b><span>Pending Amount</span></div><div class="stat"><b id="totalAmount">₹0</b><span>Total Amount</span></div></section><section id="list" class="list"><div class="card empty">Select a month to load students.</div></section></main><div id="modal" class="modal"><div class="modalbox"><div class="studenttop"><div><h2 style="margin:0 0 4px">Update Payment</h2><div id="editRoll" class="sub" style="color:#687386"></div></div><button class="ghost" onclick="closeModal()">✕</button></div><form id="form" onsubmit="saveStudent(event)"><div class="formgrid" style="margin-top:14px"><input type="hidden" id="froll"><label>Status<select id="fstatus"><option>PAID</option><option>NOT PAID</option><option>ERROR</option></select></label><label>Amount<input id="famount" inputmode="decimal" placeholder="0"></label><label>Payment Date<input id="fdate" type="date"></label><label>Receipt / Reference<input id="fref"></label><label>Transaction ID<input id="ftrans"></label><label>Retry Count<input id="fretry" type="number" min="0" value="0"></label><label class="full">Error / Note<input id="ferror"></label></div><div class="actions"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="primary">Save Update</button></div></form></div></div><div id="toast" class="toast"></div><script>
let students=[], current=null;const $=id=>document.getElementById(id);function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function cls(s){s=String(s||'').toUpperCase();return s==='PAID'?'paid':s==='NOT PAID'?'notpaid':s==='ERROR'?'error':'unknown'}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}async function loadMonths(){try{let r=await fetch('/api/months');let d=await r.json();if(!d.ok)throw Error(d.error);$('month').innerHTML=d.months.map(m=>`<option>${esc(m)}</option>`).join('');await loadStudents()}catch(e){$('month').innerHTML='<option>API unavailable</option>';toast('Could not load months: '+e.message)}}async function loadStudents(){let m=$('month').value;if(!m||m==='API unavailable'||m.includes('Loading'))return;document.body.classList.add('loading');try{let r=await fetch('/api/students?month='+encodeURIComponent(m));let d=await r.json();if(!d.ok)throw Error(d.error);students=d.students||[];window.monthSummary=d.summary||null;render();toast(students.length+' students loaded for '+m)}catch(e){toast('Load failed: '+e.message)}finally{document.body.classList.remove('loading')}}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2})}function render(){let q=$('search').value.trim().toUpperCase(),f=$('filter').value;let a=students.filter(s=>(!q||String(s.rollNo).toUpperCase().includes(q))&&(f==='ALL'||String(s.status).toUpperCase()===f));let sm=window.monthSummary||{};$('total').textContent=sm.totalStudents??students.length;$('paid').textContent=sm.paidStudents??students.filter(s=>String(s.status).toUpperCase()==='PAID').length;$('notpaid').textContent=sm.pendingStudents??students.filter(s=>String(s.status).toUpperCase()==='NOT PAID').length;$('errors').textContent=sm.errorStudents??students.filter(s=>String(s.status).toUpperCase()==='ERROR').length;$('paidAmount').textContent=money(sm.paidAmount);$('pendingAmount').textContent=money(sm.pendingAmount);$('totalAmount').textContent=money(sm.totalAmount);$('list').innerHTML=a.length?a.map(s=>`<article class="student card"><div><div class="studenttop"><div class="roll">${esc(s.rollNo)}</div><span class="status ${cls(s.status)}">${esc(s.status||'UNKNOWN')}</span></div><div class="sub" style="color:#687386;margin-top:5px">Row ${esc(s.row)}</div></div><div class="meta"><div><small>Amount</small><strong>₹${esc(s.amount||'0')}</strong></div><div><small>Date</small><strong>${esc(s.paymentDate||'—')}</strong></div><div><small>Reference</small><strong>${esc(s.paymentRef||'—')}</strong></div></div><button class="primary" onclick="openEdit('${String(s.rollNo).replace(/'/g,"\\'")}')">Edit</button></article>`).join(''):'<div class="card empty">No matching students.</div>'}function openEdit(roll){current=students.find(s=>String(s.rollNo)===String(roll));if(!current)return;$('editRoll').textContent=current.rollNo;$('froll').value=current.rollNo;$('fstatus').value=['PAID','NOT PAID','ERROR'].includes(String(current.status).toUpperCase())?String(current.status).toUpperCase():'NOT PAID';$('famount').value=current.amount||'';$('fdate').value=current.paymentDate&&/^\d{4}-\d{2}-\d{2}$/.test(current.paymentDate)?current.paymentDate:'';$('fref').value=current.paymentRef||'';$('ftrans').value=current.transactionId||'';$('fretry').value=current.retryCount||0;$('ferror').value=current.error||'';$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}async function saveStudent(e){e.preventDefault();if(!confirm('Save this payment update to Google Sheet?'))return;let p={month:$('month').value,rollNo:$('froll').value,status:$('fstatus').value,amount:$('famount').value,paymentDate:$('fdate').value,paymentRef:$('fref').value,transactionId:$('ftrans').value,retryCount:$('fretry').value,error:$('ferror').value};try{let r=await fetch('/api/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});let d=await r.json();if(!d.ok)throw Error(d.error);toast('Payment updated successfully');closeModal();await loadStudents()}catch(e){toast('Save failed: '+e.message)}}
async function showJob(j){
  const c=j.counts||{};
  const total=Number(j.total||0), done=Number(j.processed||0);
  const current=j.current?(' • Current: '+j.current):''; const stage=j.stage?(' • '+j.stage):'';
  if(j.running){
    $('autoStatus').textContent='⏳ Checking '+done+' / '+total+' NOT PAID students for '+(j.month||'')+current+stage;
    if(j.stale){ $('autoStatus').textContent += ' — no progress for '+(j.staleSeconds||0)+'s'; }
    $('autoBtn').disabled=true;
  }else if(j.error){
    $('autoStatus').textContent='❌ '+j.error;
    $('autoBtn').disabled=false;
  }else if(j.finishedAt){
    $('autoStatus').textContent='✅ Completed — PAID: '+(c.PAID||0)+' | Still NOT PAID: '+(c['NOT PAID']||0)+' | Errors: '+(c.ERROR||0);
    $('autoBtn').disabled=false;
  }
  const log=$('autoLog');
  const rows=j.results||[];
  if(rows.length){
    log.style.display='block';
    log.textContent=rows.map(x=>{
      let line=(x.rollNo||'')+' -> '+(x.status||'ERROR');
      if(x.status==='PAID' && x.amount!=='') line+=' ₹'+x.amount+(x.paymentDate?' '+x.paymentDate:'');
      if(x.error) line+=' | '+x.error;
      return line;
    }).join('\n');
  }
}
async function pollNonPaid(){
  try{
    let r=await fetch('/api/update-nonpaid/status',{cache:'no-store'});
    let d=await r.json(),j=d.job||{};
    await showJob(j);
    if(j.running){
      setTimeout(pollNonPaid,2000);
      return;
    }
    if(j.finishedAt){
      await loadStudents();
      toast(j.error?'Update stopped: '+j.error:'NOT PAID update completed');
    }
  }catch(e){
    $('autoStatus').textContent='Waiting for update status…';
    setTimeout(pollNonPaid,3000);
  }
}
async function updateNonPaid(){
  const month=$('month').value;
  if(!month||month==='API unavailable'||month.includes('Loading')){toast('Select a month first');return}
  if(!confirm('Check all NOT PAID students for '+month+' on BillDesk and update the Google Sheet?'))return;
  $('autoBtn').disabled=true;
  $('autoStatus').textContent='Reading '+month+' from Google Sheet…';
  try{
    let r=await fetch('/api/update-nonpaid',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({month})});
    let d=await r.json();
    // If an update is already running, attach this browser to the existing job
    // instead of showing a dead-end error.
    if(r.status===409 && d.job && d.job.running){
      $('autoStatus').textContent='⏳ An update is already running — attaching to it…';
      await showJob(d.job);
      pollNonPaid();
      return;
    }
    if(!d.ok)throw Error(d.error||'Could not start update');
    $('autoLog').style.display='block';
    $('autoLog').textContent='Starting '+(d.job?.total||0)+' NOT PAID students…';
    await showJob(d.job||{});
    pollNonPaid();
  }catch(e){
    $('autoStatus').textContent='❌ Update failed: '+e.message;
    $('autoBtn').disabled=false;
    toast('Update failed: '+e.message);
  }
}
async function resetStuckUpdate(){
  try{
    let r=await fetch('/api/update-nonpaid/reset',{method:'POST'});
    let d=await r.json();
    if(!d.ok)throw Error(d.error||'Could not reset update');
    toast('Stuck update cleared. You can start again.');
    await showJob(d.job||{});
  }catch(e){toast(e.message)}
}
loadMonths();
setTimeout(pollNonPaid,1200);
</script></body></html>
